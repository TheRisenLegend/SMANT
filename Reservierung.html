                    <Uhrzeit mit Hinweis auf Öffnungszeiten>
                        <label for="time">Uhrzeit:</label>
                        <input type="time" id="time" name="time" min="11:00" max="22:30" step="900" required> <br>

                        <p style="font-size: 0.8em; color: gray;">
                        </p>
                    </form>
                </p>

 <button type="submit">Tisch reservieren</button> <br>
