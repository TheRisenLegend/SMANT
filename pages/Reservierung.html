<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservierung</title>
    <link rel="stylesheet" href="../styles/index.css">
</head>
<body>

    <h1>Reservierung</h1>

    <p>Reservieren Sie hier Ihren Tisch:</p>

    <form action="/reservierung-senden" method="POST">
        <label for="name">Name der Reservierung:</label>
        <input type="text" id="name" name="name" placeholder="z. B. Max Mustermann" required> <br>

        <label for="guests">Personen (bis max. 5 Personen):</label>
        <input type="number" id="guests" name="guests" min="1" max="5" required> <br>

        <label for="date">Datum:</label>
        <input type="date" id="date" name="date" required> <br>

        <label for="time">Uhrzeit:</label>
        <input type="time" id="time" name="time" min="11:00" max="22:30" step="900" required> <br>

        <p style="font-size: 0.85em; color: var(--text-muted);">
            Öffnungszeiten: Mo-Fr 11:00-22:00, Sa-So 12:00-23:00
        </p>

        <button type="submit">Tisch reservieren</button>
    </form>

    <br>
    <a href="../index.html">Zurück zur Startseite</a>

</body>
</html>
